name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Public-safety check (no private media/text in repo)
        run: npm run check:public
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Public-safety check (built bundle)
        run: npm run check:public
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - name: End-to-end tests (non-personal fixtures)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
